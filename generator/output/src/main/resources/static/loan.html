<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Loan</title><link rel="stylesheet" href="style.css"></head>
<body>
  <nav class="sidebar">
    <a href="index.html">Home</a>
    <a href="library.html">Library</a>
    <a href="studentmember.html">StudentMember</a>
    <a href="staffmember.html">StaffMember</a>
    <a href="book.html">Book</a>
    <a href="author.html">Author</a>
    <a href="loan.html" class="active">Loan</a>
    <a href="librarycard.html">LibraryCard</a>
  </nav>
  <main>
    <h1>Loan</h1>
    <form onsubmit="save(event)">
      <label>loanDay <input name="loanDay" type="number"></label>
      <label>dueDay <input name="dueDay" type="number"></label>
      <label>returned <input name="returned" type="checkbox"></label>
      <label>memberId <input name="memberId" type="number"></label>
      <label>bookId <select name="bookId"></select></label>
      <button type="submit" id="submitBtn">Create</button>
      <button type="button" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
    </form>
    <table id="list">
      <thead><tr><th>id</th><th>loanDay</th><th>dueDay</th><th>returned</th><th>memberId</th><th>bookId</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </main>
<script>
const API = '/api/loans';
let editId = null;   // null = a criar (POST); senão o id a editar (PUT)

async function load() {
  const items = await (await fetch(API)).json();
  const tbody = document.querySelector('#list tbody');
  tbody.innerHTML = '';
  for (const item of items) {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${item.id ?? ''}</td>
      <td>${item.loanDay ?? ''}</td>
      <td>${item.dueDay ?? ''}</td>
      <td>${item.returned ?? ''}</td>
      <td>${item.memberId ?? ''}</td>
      <td>${item.bookId ?? ''}</td>
      <td><button onclick="edit('${item.id}')">edit</button> <button onclick="remove('${item.id}')">delete</button></td>`;
    tbody.appendChild(row);
  }
}

async function loadOptions() {
  fillSelect('[name="bookId"]', '/api/books', 'id');
}

async function fillSelect(selector, url, idField) {
  const items = await (await fetch(url)).json();
  const select = document.querySelector(selector);
  select.innerHTML = '<option value="">-- none --</option>';
  for (const item of items) {
    const opt = document.createElement('option');
    opt.value = item[idField];
    opt.textContent = item[idField];
    select.appendChild(opt);
  }
}

async function save(event) {
  event.preventDefault();
  const form = event.target;
  const body = {
    loanDay: Number(form.loanDay.value),
    dueDay: Number(form.dueDay.value),
    returned: form.returned.checked,
    memberId: form.memberId.value ? Number(form.memberId.value) : null,
    bookId: form.bookId.value ? Number(form.bookId.value) : null,
  };
  const method = editId === null ? 'POST' : 'PUT';
  const url = editId === null ? API : `${API}/${editId}`;
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) {
    // o backend devolve {"error": "..."} (validação OCL, etc.); mostra a mensagem
    const err = await res.json().catch(() => null);
    alert(err && err.error ? err.error : 'Save failed: ' + res.status);
    return;
  }
  cancelEdit();   // limpa o form e volta ao modo criar
  load();
}

async function edit(id) {
  const item = await (await fetch(`${API}/${id}`)).json();
  const form = document.querySelector('form');
  form.loanDay.value = item.loanDay ?? '';
  form.dueDay.value = item.dueDay ?? '';
  form.returned.checked = !!item.returned;
  form.memberId.value = item.memberId ?? '';
  form.bookId.value = item.bookId ?? '';
  editId = id;
  document.getElementById('submitBtn').textContent = 'Update';
  document.getElementById('cancelBtn').style.display = '';
}

function cancelEdit() {
  document.querySelector('form').reset();
  editId = null;
  document.getElementById('submitBtn').textContent = 'Create';
  document.getElementById('cancelBtn').style.display = 'none';
}

async function remove(id) {
  if (!confirm('Delete ' + id + '?')) return;
  await fetch(`${API}/${id}`, { method: 'DELETE' });
  load();
}

loadOptions();
load();
</script>
</body>
</html>
