<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>StaffMember</title><link rel="stylesheet" href="style.css"></head>
<body>
  <nav class="sidebar">
    <a href="index.html">Home</a>
    <a href="library.html">Library</a>
    <a href="studentmember.html">StudentMember</a>
    <a href="staffmember.html" class="active">StaffMember</a>
    <a href="book.html">Book</a>
    <a href="author.html">Author</a>
    <a href="loan.html">Loan</a>
    <a href="librarycard.html">LibraryCard</a>
  </nav>
  <main>
    <h1>StaffMember</h1>
    <form onsubmit="save(event)">
      <label>department <input name="department" type="text"></label>
      <label>memberNumber <input name="memberNumber" type="number"></label>
      <label>name <input name="name" type="text"></label>
      <label>email <input name="email" type="text"></label>
      <label>points <input name="points" type="number"></label>
      <label>activeLoans <input name="activeLoans" type="number"></label>
      <label>libraryId <select name="libraryId"></select></label>
      <label>cardId <select name="cardId"></select></label>
      <button type="submit" id="submitBtn">Create</button>
      <button type="button" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
    </form>
    <table id="list">
      <thead><tr><th>id</th><th>department</th><th>memberNumber</th><th>name</th><th>email</th><th>points</th><th>activeLoans</th><th>libraryId</th><th>cardId</th><th>reservedBookIds</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <h2>Relationships</h2>
    <form class="rel" data-path="reservedbook" data-numeric="true" onsubmit="addItem(event)">
      <label>StaffMember id <input name="parent" type="number"></label>
      <label>reservedBook <select name="child"></select></label>
      <button type="submit">Add</button>
      <button type="button" onclick="removeItem(this)">Remove</button>
    </form>
  </main>
<script>
const API = '/api/staffmembers';
let editId = null;   // null = a criar (POST); senão o id a editar (PUT)

async function load() {
  const items = await (await fetch(API)).json();
  const tbody = document.querySelector('#list tbody');
  tbody.innerHTML = '';
  for (const item of items) {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${item.id ?? ''}</td>
      <td>${item.department ?? ''}</td>
      <td>${item.memberNumber ?? ''}</td>
      <td>${item.name ?? ''}</td>
      <td>${item.email ?? ''}</td>
      <td>${item.points ?? ''}</td>
      <td>${item.activeLoans ?? ''}</td>
      <td>${item.libraryId ?? ''}</td>
      <td>${item.cardId ?? ''}</td>
      <td>${item.reservedBookIds ?? ''}</td>
      <td><button onclick="edit('${item.id}')">edit</button> <button onclick="remove('${item.id}')">delete</button></td>`;
    tbody.appendChild(row);
  }
}

async function loadOptions() {
  fillSelect('[name="libraryId"]', '/api/librarys', 'id');
  fillSelect('[name="cardId"]', '/api/librarycards', 'id');
  fillSelect('form[data-path="reservedbook"] [name="child"]', '/api/books', 'id');
}

async function fillSelect(selector, url, idField) {
  const items = await (await fetch(url)).json();
  const select = document.querySelector(selector);
  select.innerHTML = '<option value="">-- none --</option>';
  for (const item of items) {
    const opt = document.createElement('option');
    opt.value = item[idField];
    opt.textContent = item[idField];
    select.appendChild(opt);
  }
}

async function save(event) {
  event.preventDefault();
  const form = event.target;
  const body = {
    department: form.department.value,
    memberNumber: Number(form.memberNumber.value),
    name: form.name.value,
    email: form.email.value,
    points: Number(form.points.value),
    activeLoans: Number(form.activeLoans.value),
    libraryId: form.libraryId.value ? Number(form.libraryId.value) : null,
    cardId: form.cardId.value ? Number(form.cardId.value) : null,
  };
  const method = editId === null ? 'POST' : 'PUT';
  const url = editId === null ? API : `${API}/${editId}`;
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) {
    // o backend devolve {"error": "..."} (validação OCL, etc.); mostra a mensagem
    const err = await res.json().catch(() => null);
    alert(err && err.error ? err.error : 'Save failed: ' + res.status);
    return;
  }
  cancelEdit();   // limpa o form e volta ao modo criar
  load();
}

async function edit(id) {
  const item = await (await fetch(`${API}/${id}`)).json();
  const form = document.querySelector('form');
  form.department.value = item.department ?? '';
  form.memberNumber.value = item.memberNumber ?? '';
  form.name.value = item.name ?? '';
  form.email.value = item.email ?? '';
  form.points.value = item.points ?? '';
  form.activeLoans.value = item.activeLoans ?? '';
  form.libraryId.value = item.libraryId ?? '';
  form.cardId.value = item.cardId ?? '';
  editId = id;
  document.getElementById('submitBtn').textContent = 'Update';
  document.getElementById('cancelBtn').style.display = '';
}

function cancelEdit() {
  document.querySelector('form').reset();
  editId = null;
  document.getElementById('submitBtn').textContent = 'Create';
  document.getElementById('cancelBtn').style.display = 'none';
}

async function remove(id) {
  if (!confirm('Delete ' + id + '?')) return;
  await fetch(`${API}/${id}`, { method: 'DELETE' });
  load();
}

async function addItem(event) {
  event.preventDefault();
  await sendItem(event.target, 'POST');
}

async function removeItem(btn) {
  await sendItem(btn.closest('form'), 'DELETE');
}

async function sendItem(form, method) {
  const child = form.dataset.numeric === 'true' ? Number(form.child.value) : form.child.value;
  const res = await fetch(`${API}/${form.parent.value}/${form.dataset.path}`, {
    method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify([child]),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => null);
    alert(err && err.error ? err.error : method + ' failed: ' + res.status);
    return;
  }
  load();
}

loadOptions();
load();
</script>
</body>
</html>
