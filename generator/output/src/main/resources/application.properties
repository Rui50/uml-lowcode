spring.application.name=spring-template-app
server.port=8080

# perfil por defeito = dev (corre localmente sem config).
# em produção: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# evita N+1 ao mapear coleções: carrega as coleções lazy de uma página em
# lotes (WHERE fk IN (...)) em vez de uma query por linha
spring.jpa.properties.hibernate.default_batch_fetch_size=50
